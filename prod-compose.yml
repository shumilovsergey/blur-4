services:
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /blur /out/blur
        printf "\033[1;32m\n"
        printf "  ╔═════════════════════════════════════════╗\n"
        printf "  ║             BLUR PROD BUILD             ║\n"
        printf "  ║  Built: %-32s║\n" "$(/out/blur --version)"
        printf "  ╚═════════════════════════════════════════╝\n"
        printf "\033[0m\n"

# docker compose -f prod-compose.yml build --no-cache && docker compose -f prod-compose.yml up
